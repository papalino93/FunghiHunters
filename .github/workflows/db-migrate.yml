name: Migrazione del database

# Esegue un file di `db/migrations/` sul database di Supabase, a mano e uno alla volta.
#
# Perché un'azione e non l'SQL Editor: così le modifiche al database le può lanciare anche chi
# lavora sul codice, senza che il proprietario del progetto debba copiare e incollare SQL. La
# chiave resta un segreto di GitHub (`SUPABASE_DB_URL`, la stringa di connessione «Session
# pooler» della dashboard di Supabase): non compare mai nel codice né nei log, e nessuno la
# deve scrivere in una chat.
#
# Solo a mano (workflow_dispatch), mai a calendario né a ogni push: una migrazione cambia il
# database di produzione e va lanciata sapendo quale. `ON_ERROR_STOP`: al primo errore si ferma,
# e la corsa diventa rossa con il messaggio di Postgres.
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'File da eseguire, per esempio db/migrations/0011_senza_postgis.sql'
        required: true

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Controlla il file richiesto
        # L'input passa da una variabile d'ambiente e deve essere un file di migrazione vero:
        # niente percorsi strani, niente comandi.
        env:
          FILE: ${{ inputs.file }}
        run: |
          if [[ ! "$FILE" =~ ^db/migrations/[0-9]{4}_[a-z0-9_]+\.sql$ ]] || [ ! -f "$FILE" ]; then
            echo "::error::File non valido: $FILE"
            exit 1
          fi

      - name: Controlla che la chiave ci sia
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Manca il segreto SUPABASE_DB_URL (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Installa psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null

      - name: Esegui la migrazione
        env:
          FILE: ${{ inputs.file }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --echo-errors -f "$FILE"
