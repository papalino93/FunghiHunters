# Assegna a ogni zona italiana il bosco che ha davvero.
#
# Non e' schedulato: il bosco non cambia da un giorno all'altro, e la fonte e' ferma al 2020.
# Si lancia a mano quando cambia il catalogo delle zone o il raggio di campionamento, e il
# risultato resta committato nel repository.
#
# Gira qui e non altrove perche' serve rete aperta verso Zenodo (circa 3 GB, dieci archivi da
# 100 km di larghezza ciascuno): l'ambiente in cui si scrive il codice riceve 403.

name: Catalogo boschi Italia

on:
  workflow_dispatch:
    inputs:
      columns:
        description: "Colonne da elaborare, separate da virgola (vuoto = tutte quelle che servono). Per una prova: 4400, che contiene il Casentino"
        required: false
        default: ''
      radius_km:
        description: "Raggio attorno al punto di riferimento del comune, in km"
        required: false
        default: '3'
      dry_run:
        description: "true = stampa e basta, non scrive e non committa"
        required: false
        default: 'false'
      apply_only:
        description: "true = non riscarica niente, riapplica il bosco gia' letto agli snapshot di regione"
        required: false
        default: 'false'
      relocate:
        description: "true = sposta il punto di calcolo di ogni zona dentro il bosco e riscrive il catalogo zone. Non pubblica il bosco: serve una seconda corsa normale sui punti nuovi"
        required: false
        default: 'false'
      catalog:
        description: "italia = catalogo nazionale (zones-italia.json); toscana = tutti i comuni toscani (zones-toscana.json)"
        required: false
        default: 'italia'

permissions:
  contents: write

concurrency:
  group: forest-catalog
  cancel-in-progress: false

jobs:
  forest:
    runs-on: ubuntu-latest
    # Tre giga di scaricamento da Zenodo, che non e' veloce, piu' il campionamento delle zone.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Spazio su disco prima di iniziare
        run: df -h /

      - name: Leggi il bosco delle zone
        if: inputs.apply_only != 'true'
        run: >-
          npx tsx scripts/ingest-forest-italia.ts
          --radius-km ${{ inputs.radius_km }}
          ${{ inputs.columns != '' && format('--columns {0}', inputs.columns) || '' }}
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
          ${{ inputs.relocate == 'true' && '--relocate' || '' }}
          ${{ inputs.catalog == 'toscana' && '--catalog toscana' || '' }}

      # Aggiorna l'etichetta del bosco sui file gia' pronti, senza rifare il meteo.
      #
      # ATTENZIONE, dalla versione 1.4.0 del modello: il bosco **entra** nel punteggio, quindi
      # dopo questo passaggio l'etichetta e' quella nuova ma il punteggio e' ancora quello vecchio.
      # E' una differenza che dura fino al primo ricalcolo (una volta al giorno fuori dalla
      # Toscana), e si accetta solo perche' l'alternativa — un'ora di attesa e quasi 6.000
      # chiamate del budget giornaliero — la pagherebbe comunque il calcolo notturno. Quando
      # conta, si lancia a mano lo snapshot subito dopo.
      - name: Scrivilo sugli snapshot di regione
        if: inputs.dry_run != 'true' && inputs.relocate != 'true' && inputs.catalog != 'toscana'
        run: npx tsx scripts/apply-forest-to-snapshots.ts

      - name: Commit
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data
          if git diff --staged --quiet; then
            echo "Nessuna variazione: niente da committare."
          else
            git commit -m "${{ inputs.relocate == 'true' && 'Punti di calcolo spostati nel bosco' || 'Catalogo boschi' }} (${{ inputs.catalog }}) $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
