# Genera il catalogo nazionale delle zone.
#
# Non e' schedulato: i confini comunali e la quota del terreno non cambiano. Si lancia a mano
# quando si cambiano i criteri (soglia di quota, tetto al numero di zone), e il risultato resta
# committato nel repository.
#
# Esiste come workflow e non come comando da eseguire a mano altrove perche' serve rete aperta
# verso `raw.githubusercontent.com` (confini ISTAT, 36 MB) e verso Open-Meteo (quota del terreno):
# l'ambiente in cui si scrive il codice non li raggiunge, questo runner si'.

name: Catalogo zone Italia

on:
  workflow_dispatch:
    inputs:
      min_elevation:
        description: "Quota minima del terreno perche' un comune diventi zona (metri)"
        required: false
        default: '600'
      max_zones:
        description: "Tetto al numero di zone: 1200 e' il massimo che il piano gratuito Open-Meteo regge ogni giorno"
        required: false
        default: '1200'

permissions:
  contents: write

concurrency:
  group: zone-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    # La risoluzione delle quote va a passo d'uomo per rispettare i limiti di Open-Meteo:
    # circa 7.500 comuni a 5.000 chiamate l'ora significa scavallare un paio di finestre orarie.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Genera il catalogo
        run: >-
          npx tsx scripts/ingest-zones-italia.ts
          --min-elevation ${{ inputs.min_elevation }}
          --max-zones ${{ inputs.max_zones }}

      # Il punteggio delle zone nuove NON si calcola qui, e non per dimenticanza.
      # I limiti di Open-Meteo valgono per indirizzo IP, e i due passi girerebbero sullo stesso
      # runner: risolvere le quote di ~7.500 comuni costa 7.500 chiamate pesate, calcolare 1.200
      # zone ne costa altre 5.800, e insieme sfondano il tetto di 10.000 al giorno. Il secondo
      # passo fallirebbe proprio quando il primo ha finito, e con lui salterebbe il commit del
      # catalogo appena costruito — un'ora e mezza di lavoro persa per un errore evitabile.
      # I punteggi arrivano quindi dalla corsa "Snapshot giornaliero", che gira su un altro runner
      # con il suo budget: parte da sola alle 11:40 UTC, oppure si lancia a mano subito dopo.

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data
          if git diff --staged --quiet; then
            echo "Nessuna variazione: niente da committare."
          else
            git commit -m "Catalogo zone Italia $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
