# Ricalcolo giornaliero dell'MPI.
#
# Gira qui e non su Vercel per due motivi misurati, non per gusto:
# il piano Hobby di Vercel consente un solo cron al giorno con precisione di un'ora, e le sue
# funzioni si fermano a 300 secondi, mentre questo job scarica quaranta serie storiche dal SIR.
# GitHub Actions su repository pubblico ha minuti illimitati e sette ore per job.
#
# Il cron di GitHub e' best-effort e puo' ritardare di mezz'ora nelle ore di punta. Per un
# processo con latenza biologica di settimane e' irrilevante.

name: Snapshot giornaliero

on:
  schedule:
    # 11:40 UTC: il SIR aggiorna i suoi layer verso le 10:30 UTC, quindi troviamo il dato fresco.
    - cron: '40 11 * * *'
    # 23:05 UTC, poco dopo mezzanotte in Italia: 01:05 con l'ora legale, 00:05 con quella
    # solare. GitHub Actions capisce solo UTC, quindi non esiste un orario fisso che sia
    # "00:01 italiane" tutto l'anno — 23:05 UTC e' il piu' vicino che resta comunque dopo la
    # mezzanotte locale in entrambi i casi. Non porta dati SIR piu' freschi (quelli arrivano
    # solo con la corsa delle 11:40), ma mette prima in produzione un fix appena mersato e
    # aggiorna le previsioni Open-Meteo, che cambiano piu' spesso nell'arco della giornata.
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Registro delle chiamate a Open-Meteo condiviso fra i passi: vedi `ledgerPath` in
    # `src/lib/sources/open-meteo-rate.ts`. Fuori dal repository, non si committa.
    env:
      OPEN_METEO_LEDGER: /tmp/open-meteo-ledger.json
    # Lo snapshot toscano dura pochi minuti; quello nazionale deve rallentare apposta per non
    # sfondare i limiti orari del piano gratuito di Open-Meteo, e con 1200 zone e la pioggia
    # ICON-2I arriva a quasi due ore. La Toscana completa con le stazioni SIR aggiunge mezz'ora.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Il motore deve essere verde prima di produrre numeri che finiscono in mappa.
      - run: npm run typecheck
      - run: npm run test

      # `continue-on-error` anche qui, per un motivo diverso da quello del passo nazionale: se una
      # fonte giornaliera e' giu' (il SIR che non risponde), lo script toscano scrive lo stesso lo
      # snapshot dal solo modello, con la fonte dichiarata "down", e poi esce con 1. Quel file va
      # committato, e il passo nazionale deve girare comunque. Il fallimento non si perde: lo
      # raccoglie l'ultimo passo, che fa diventare rossa la corsa dopo il commit. Se invece manca
      # Open-Meteo lo script esce senza scrivere niente, e resta lo snapshot di ieri.
      - name: Calcola lo snapshot
        id: toscana
        continue-on-error: true
        run: npx tsx scripts/build-snapshot.ts --stations 45

      # Tutti i comuni boscati della Toscana, con pioggia e temperature dai pluviometri SIR (vedi
      # `scripts/build-snapshot-toscana.ts`). Prima del nazionale, che ne riprende le voci
      # d'indice. Solo sulla corsa delle 11:40: due corse al giorno di questo e del nazionale
      # starebbero troppo vicine al tetto giornaliero di Open-Meteo. Senza catalogo toscano lo
      # script esce senza fare nulla.
      - name: Calcola la Toscana completa con le stazioni
        id: toscana_completa
        if: github.event.schedule != '5 23 * * *'
        continue-on-error: true
        timeout-minutes: 60
        run: npx tsx scripts/build-snapshot-toscana.ts

      # Le zone fuori dalla Toscana: solo modello meteo, nessuna stazione da scaricare. Costano
      # pero' molto in chiamate pesate a Open-Meteo (una localita' su 68 giorni vale quasi cinque
      # chiamate), quindi girano **una volta al giorno sola**, sulla corsa delle 11:40, e non
      # anche su quella notturna: due corse sfonderebbero il tetto giornaliero del piano gratuito.
      # Se il catalogo non e' ancora stato generato lo script esce senza fare nulla e senza fallire.
      #
      # `continue-on-error` non e' pigrizia: senza, un limite di frequenza sul pezzo nazionale
      # farebbe saltare il commit e la Toscana perderebbe il suo aggiornamento del giorno, che e'
      # la parte del sito con le stazioni vere dietro. Il pezzo nazionale puo' saltare un giro.
      #
      # Saltarlo pero' non vuol dire saltarlo in silenzio: da solo, `continue-on-error` lasciava
      # la corsa verde anche con il nazionale fallito, e nessuno lo sapeva finche' non apriva i
      # log. L'`id` serve all'ultimo passo per leggerne l'esito vero (`outcome` resta "failure"
      # anche quando `continue-on-error` rende "success" la `conclusion`). Un singolo lotto
      # Open-Meteo perso non fa fallire lo script: le regioni colpite tengono il file di ieri e
      # compaiono in un avviso in cima alla corsa. Fallisce solo se non si e' salvato niente.
      - name: Calcola lo snapshot nazionale
        id: nazionale
        if: github.event.schedule != '5 23 * * *'
        continue-on-error: true
        run: npx tsx scripts/build-snapshot-italia.ts

      # Nessun `if: always()`: grazie a `continue-on-error` i due passi di calcolo non fermano il
      # job, quindi il commit gira anche quando hanno fallito. Resta invece fermo quando sono
      # falliti typecheck o test (numeri da un motore rotto non vanno in mappa) o quando la corsa
      # e' stata annullata a meta'.
      - name: Commit se qualcosa e' cambiato
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tutta la cartella, non i singoli file: `public/data/regioni/` nasce solo quando il
          # catalogo nazionale e' stato generato, e nominare un percorso che non esiste ancora
          # farebbe fallire il comando nei giorni in cui non c'e'.
          git add -A public/data
          # Senza questo controllo il job fallirebbe nei giorni in cui nulla cambia.
          if git diff --staged --quiet; then
            echo "Nessuna variazione: niente da committare."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%d)"
            # Fra il checkout a inizio job e il push possono passare diversi minuti (lo scarico
            # delle serie SIR ci mette la maggior parte del tempo): se nel frattempo qualcun
            # altro ha aggiornato main — una PR mersata, l'altra corsa schedulata — il push nudo
            # viene rifiutato "non-fast-forward" e lo snapshot appena calcolato va perso.
            # Il rebase riapplica questo commit sopra la storia nel frattempo avanzata.
            git pull --rebase origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Dati nuovi pubblicati: si avvisano i motori che aderiscono a IndexNow (Bing e altri).
      # L'attesa lascia a Vercel il tempo di mettere online il deploy con i dati nuovi. Mai
      # bloccante: un avviso mancato si recupera il giorno dopo.
      - name: Avvisa IndexNow
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sleep 150
          npx tsx scripts/indexnow.ts

      # Per ultimo, dopo il commit: i dati che si sono potuti calcolare sono gia' salvati, e solo
      # ora la corsa diventa rossa — cosi' GitHub manda l'email di fallimento al proprietario
      # invece di lasciare un job verde con un pezzo mancante.
      - name: Segnala i calcoli falliti
        if: ${{ !cancelled() && (steps.toscana.outcome == 'failure' || steps.toscana_completa.outcome == 'failure' || steps.nazionale.outcome == 'failure') }}
        env:
          TOSCANA: ${{ steps.toscana.outcome }}
          TOSCANA_COMPLETA: ${{ steps.toscana_completa.outcome }}
          NAZIONALE: ${{ steps.nazionale.outcome }}
        run: |
          echo "::error title=Snapshot incompleto::snapshot toscano: $TOSCANA, Toscana completa: $TOSCANA_COMPLETA, nazionale: $NAZIONALE. I dati calcolati sono stati committati, il resto e' rimasto alla corsa precedente: dettagli nelle annotazioni e nei log dei due passi."
          exit 1
